<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1
        { background-color: hotpink;
            color: aliceblue;
            padding: 20px;
            border: 1px solid black;
            text-align: center;
        }

        table, th, td
        {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
            text-align: center;
        }
    </style>

</head>
<body>

   <h1>Exercício 1</h1> 

   <table>

    <tr>
        <td colspan="2">Coluna 1</td>
        <td>Coluna 2</td>
        <td>Coluna 3</td>
    </tr>

    
    <tr>
        <td>Coluna 1</td>
        <td colspan="3">Coluna 2</td>
    </tr>

    
    <tr>
        <td rowspan="2">Coluna 1</td>
        <td>Coluna 2</td>
        <td>Coluna 3</td>
        <td>Coluna 4</td>
    </tr>

    
    <tr>
        <td>Coluna 2</td>
        <td>Coluna 3</td>
        <td>Coluna 4</td>
    </tr>

    
    <tr>
        <td>Coluna 1</td>
        <td rowspan="3">Coluna 2</td>
        <td>Coluna 3</td>
        <td>Coluna 4</td>
    </tr>

    
    <tr>
        <td>Coluna 1</td>
        <td colspan="2">Coluna 3</td>
    </tr>

    
    <tr>
        <td>Coluna 1</td>
        <td>Coluna 3</td>
        <td>Coluna 4</td>
    </tr>

   </table>
</body>
</html>
